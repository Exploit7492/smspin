<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — SMSPin</title>
<meta name="theme-color" content="#1a0608">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#1a0608; --page-glow:#3a0a10; --card-bg:#140a0b; --input-bg:#1c0f10;
    --card-border:#4a1218; --input-border:#5a1a20; --brand:#e11d2e; --coral:#f43f4f;
    --link:#ff4d5a; --heading:#fdf2ee; --body:#a8a0a0; --label:#d6cfcf;
    --placeholder:#6b6464; --btn-text:#1a0a0a;
    --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh; background:var(--page-bg);
    background-image:radial-gradient(ellipse at 50% 100%, var(--page-glow) 0%, var(--page-bg) 65%);
    color:var(--heading); font-family:var(--sans); -webkit-font-smoothing:antialiased;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .auth-col{max-width:440px; margin:0 auto; width:100%}
  a{color:var(--link)}

  .back{
    display:inline-flex; align-items:center; gap:8px; padding:7px 16px; border-radius:999px;
    border:1px solid var(--input-border); background:rgba(255,255,255,.02);
    color:var(--label); font-size:14px; text-decoration:none;
  }
  .back:hover{border-color:var(--coral); color:var(--heading)}

  .brand{display:flex; align-items:center; justify-content:center; gap:10px; margin:46px 0 26px}
  .brand-ico{
    width:36px; height:36px; border-radius:9px; background:var(--brand);
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
    box-shadow:0 4px 16px rgba(225,29,46,.45);
  }
  .brand-name{font-size:24px; font-weight:700; letter-spacing:-.01em}
  .brand-name .pin{font-family:var(--serif); font-style:italic; font-weight:500; color:var(--brand)}

  .card{
    background:var(--card-bg); border:1px solid var(--card-border); border-radius:20px;
    padding:20px 20px 28px; box-shadow:0 0 60px rgba(120,10,20,.18);
  }
  .card h1{font-family:var(--serif); font-weight:700; font-size:28px; margin:0; color:var(--heading)}
  .card .sub{margin:28px 0 0; font-size:15px; color:var(--body)}

  .msg{display:none; margin:18px 0 0; padding:11px 14px; border-radius:10px; font-size:14px; line-height:1.4}
  .msg.show{display:block}
  .msg.err{background:rgba(244,63,79,.12); border:1px solid rgba(244,63,79,.35); color:#ffb4ba}
  .msg.ok{background:rgba(45,180,90,.12); border:1px solid rgba(45,180,90,.35); color:#8ce0a8}

  form{margin-top:20px}
  .field{margin-bottom:16px}
  .field label{display:block; font-size:14px; font-weight:500; color:var(--label); margin-bottom:7px}
  .field input{
    width:100%; height:46px; padding:0 16px; border-radius:10px; font:inherit; font-size:16px;
    background:var(--input-bg); border:1px solid var(--input-border); color:var(--heading);
  }
  .field input::placeholder{color:var(--placeholder)}
  .field input:focus{outline:none; border-color:var(--coral); box-shadow:0 0 0 3px rgba(244,63,79,.2)}
  .pw-row{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:7px}
  .pw-row label{margin:0}
  .pw-row a{font-size:14px; color:var(--link); text-decoration:none}
  .pw-row a:hover{text-decoration:underline}
  .pw-wrap{position:relative}
  .pw-wrap input{padding-right:48px}
  .pw-toggle{
    position:absolute; right:14px; top:50%; transform:translateY(-50%); width:24px; height:24px;
    display:inline-flex; align-items:center; justify-content:center; padding:0;
    background:transparent; border:0; color:var(--body); cursor:pointer;
  }
  .pw-toggle:hover{color:var(--heading)}

  .submit{
    width:100%; height:52px; margin-top:22px; border:0; border-radius:10px; cursor:pointer;
    background:var(--coral); color:var(--btn-text); font:inherit; font-size:17px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 8px 26px rgba(244,63,79,.35);
  }
  .submit:hover{background:#ff5564}
  .submit:disabled{opacity:.6; cursor:progress}

  .foot{margin-top:24px; text-align:center; font-size:15px; color:var(--body)}
  .foot a{color:var(--link); text-decoration:none; font-weight:600}
  .foot a:hover{text-decoration:underline}

  .note{margin:14px 0 0; text-align:center; font-size:12px; color:var(--body)}

  .chat{
    position:fixed; right:12px; bottom:calc(60px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%; border:0; cursor:pointer;
    background:var(--coral); display:inline-flex; align-items:center; justify-content:center;
    box-shadow:0 6px 20px rgba(244,63,79,.45);
  }
  .chat:hover{background:#ff5564}
</style>
</head>
<body>
<div class="auth-col">
  <a class="back" href="/">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Back to home
  </a>

  <div class="brand">
    <span class="brand-ico" aria-hidden="true">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 5c0-1.1.9-2 2-2h12c1.1 0 2 .9 2 2v9c0 1.1-.9 2-2 2h-5l-3.5 3.5c-.5.5-1.5.1-1.5-.6V16H6c-1.1 0-2-.9-2-2V5z" fill="#fff"/><rect x="7.5" y="8.5" width="2.5" height="3.5" rx=".8" fill="#e11d2e"/><rect x="10.8" y="8.5" width="2.5" height="3.5" rx=".8" fill="#e11d2e"/><rect x="14.1" y="8.5" width="2.5" height="3.5" rx=".8" fill="#e11d2e"/></svg>
    </span>
    <span class="brand-name">SMS<span class="pin">Pin</span></span>
  </div>

  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your SMSPin account.</p>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>

    <form id="f" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <div class="pw-row">
          <label for="password">Password</label>
          <a href="/forgot-password/">Forgot password?</a>
        </div>
        <div class="pw-wrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <button class="pw-toggle" type="button" id="pwToggle" aria-label="Show password" aria-pressed="false">
            <svg id="eyeOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M17.94 17.94A10.1 10.1 0 0 1 12 19c-6.5 0-10-7-10-7a17.8 17.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a17.9 17.9 0 0 1-2.16 3.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
          </button>
        </div>
      </div>
      <button class="submit" type="submit" id="submitBtn">
        Sign in
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="foot">Don’t have an account? <a href="/register/">Sign up</a></div>
  </div>

  <p class="note">Your session is encrypted end to end. We never store your password.</p>
</div>

<button class="chat" type="button" aria-label="Chat with support" onclick="location.href='/contact/'">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5c0-1.1.9-2 2-2h12c1.1 0 2 .9 2 2v9c0 1.1-.9 2-2 2h-5l-3.5 3.5c-.5.5-1.5.1-1.5-.6V16H6c-1.1 0-2-.9-2-2V5z" fill="#fff"/></svg>
</button>

<script src="/dashboard/config.js"></script>
<script src="/dashboard/api.js"></script>
<script>
(function(){
  var pw = document.getElementById('password');
  var eyeOn = document.getElementById('eyeOn'), eyeOff = document.getElementById('eyeOff');
  var toggle = document.getElementById('pwToggle');
  toggle.addEventListener('click', function(){
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eyeOn.style.display = show ? 'none' : '';
    eyeOff.style.display = show ? '' : 'none';
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    toggle.setAttribute('aria-pressed', String(show));
    pw.focus();
  });
  var msg = document.getElementById('msg');
  function show(t, cls){ msg.textContent = t; msg.className = 'msg show ' + cls; }
  var form = document.getElementById('f');
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var password = pw.value;
    if(!email || !password){ show('Enter your email and password.', 'err'); return; }
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    try {
      await SMSPIN.auth.signIn(email, password);
      show('Signed in. Redirecting…', 'ok');
      location.href = '/dashboard/';
    } catch (err) {
      show((err && err.message) || 'Sign in failed. Check your details and try again.', 'err');
      btn.disabled = false;
    }
  });
})();
</script>
<script src="/auth-brand.js"></script>
</body>
</html>
