<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My account — SMSPin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/store/auth.css">
<script>(function(){try{var d=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;var r=document.documentElement;r.setAttribute("data-theme",d?"dark":"light");r.style.backgroundColor=d?"#0a0709":"#eef1f8";}catch(e){}})();</script>
<script defer src="/theme.js"></script>
</head>
<body>
<header class="ta-top">
  <a class="ta-brand" href="#" id="taHome">
    <span class="ta-logo" data-tenant-initials aria-hidden="true">S</span>
    <span data-tenant-name>SMSPin</span>
  </a>
  <span class="ta-spacer"></span>
  <span class="ta-link" id="taWho"></span>
  <a class="ta-link" id="taLogout" style="cursor:pointer">Sign out</a>
</header>
<main class="ta-wrap" style="align-items:flex-start">
  <div class="ta-card wide">
    <div id="msg" class="ta-msg"></div>
    <div class="ta-grid">
      <div>
        <div class="ta-bal">
          <div class="l">Wallet balance</div>
          <div class="v" id="bal">₦0.00</div>
          <div class="w" id="who"></div>
        </div>
        <div class="ta-sec">
          <h2>Fund your wallet</h2>
          <div class="ta-amt-row" id="amts"></div>
          <div class="ta-field"><label for="custom">Or enter an amount (₦)</label><input id="custom" type="number" min="100" step="50" placeholder="e.g. 2500"></div>
          <div class="ta-field"><label id="methodsLbl">Payment method</label>
            <div class="ta-method-row" id="methods" role="radiogroup" aria-labelledby="methodsLbl"></div>
          </div>
          <button class="ta-btn" id="fundBtn">Continue to payment</button>
          <p class="ta-note" id="fundNote">Secured by KoraPay. Your balance is stored on this store and is only spendable here.</p>
        </div>
      </div>
      <div>
        <div class="ta-sec" style="margin-top:0">
          <h2>Buy a number</h2>
          <div class="ta-buybar">
            <input type="search" id="buySearch" class="ta-search" placeholder="Search service or country…" autocomplete="off" aria-label="Search services and countries">
          </div>
          <div class="ta-cat" id="catGrid"></div>
          <div class="ta-empty" id="catEmpty" hidden>No numbers match your search.</div>
        </div>
        <div class="ta-sec">
          <h2>Recent orders</h2>
          <div id="orders" class="ta-note">Loading…</div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="/dashboard/config.js"></script>
<script src="/dashboard/api.js"></script>
<script src="/store/auth.js"></script>
<script>
(function () {
  var S = TENANT_AUTH.slug();
  if (!S) { location.href = "/"; return; }
  var msg = document.getElementById('msg');
  var base = "/store/" + S;
  document.getElementById('taHome').href = base + "/";
  if (!SMSPIN.tenant.isAuthed(S)) { location.href = base + "/login/"; return; }

  var CAT = [];
  function money(n){ return "₦" + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  // Prices are whole numbers: a 1.56 price displays as 2.
  function whole(n){ return Math.ceil(Number(n || 0)); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
  function svcIcon(o){
    var icon = (o && (o.service_icon || o.icon)) || "";
    if (/^https?:\/\//i.test(icon)) return '<span class="ta-svc-ico"><img src="' + esc(icon) + '" alt="" loading="lazy"></span>';
    if (icon) return '<span class="ta-svc-ico">' + esc(icon) + "</span>";
    return '<span class="ta-svc-ico">' + esc(String((o && o.service) || "?").trim().slice(0,1).toUpperCase()) + "</span>";
  }

  async function loadOrders() {
    var host = document.getElementById("orders");
    try {
      var rows = await SMSPIN.tenant.orders(S, 20);
      if (!rows || !rows.length) { host.innerHTML = '<span class="ta-note">No orders yet.</span>'; return; }
      host.innerHTML = '<div class="ta-orders">' + rows.map(function (o) {
        var st = o.status === "received" ? "ok" : (o.status === "refunded" ? "wait" : "wait");
        var label = o.status === "received" ? "Received" : (o.status === "refunded" ? "Refunded" : "Waiting");
        return '<div class="ta-order">' + svcIcon(o) +
          '<div class="ta-order-main"><b>' + esc(o.service || "Number") + ' · ' + esc((o.flag ? o.flag + " " : "") + (o.country || "")) + '</b>' +
          '<span class="mono">' + esc(o.phone_number || "") + '</span></div>' +
          '<span class="ta-badge2 ' + st + '">' + label + '</span></div>';
      }).join("") + "</div>";
    } catch (e) { host.innerHTML = '<span class="ta-note">Could not load orders.</span>'; }
  }

  async function refresh() {
    try {
      var me = await SMSPIN.tenant.me(S);
      document.getElementById('who').textContent = (me.full_name || me.email) + " · " + me.email;
      document.getElementById('taWho').textContent = me.full_name || me.email;
    } catch (e) { location.href = base + "/login/"; return; }
    try { var w = await SMSPIN.tenant.wallet(S); document.getElementById('bal').textContent = money(w.balance); } catch (e) {}
  }

  // Amount presets (₦). KoraPay expects NGN.
  [500, 1000, 2500, 5000, 10000].forEach(function (a) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'ta-amt'; b.textContent = "₦" + a.toLocaleString();
    b.onclick = function () {
      document.querySelectorAll('.ta-amt').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on'); document.getElementById('custom').value = a;
    };
    document.getElementById('amts').appendChild(b);
  });

  // Payment methods come from the backend so the storefront only offers the
  // channels KoraPay actually enabled (card + bank transfer).
  var METHODS = [{ id: "card", label: "Card", note: "Visa, Mastercard, Verve" },
                 { id: "bank_transfer", label: "Bank transfer", note: "Instant NGN transfer" }];
  var method = METHODS[0].id;
  function renderMethods() {
    var host = document.getElementById('methods');
    if (!host) return;
    host.innerHTML = METHODS.map(function (m) {
      return '<button type="button" class="ta-method' + (m.id === method ? ' on' : '') + '" data-m="' + esc(m.id) + '" role="radio" aria-checked="' + (m.id === method) + '">' +
        '<b>' + esc(m.label) + '</b><span>' + esc(m.note || '') + '</span></button>';
    }).join('');
    Array.prototype.forEach.call(host.querySelectorAll('.ta-method'), function (b) {
      b.addEventListener('click', function () {
        method = b.getAttribute('data-m');
        Array.prototype.forEach.call(host.querySelectorAll('.ta-method'), function (x) {
          var on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', String(on));
        });
      });
    });
  }
  fetch("/api/payment-methods").then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (d && Array.isArray(d.methods) && d.methods.length) {
        METHODS = d.methods; method = METHODS[0].id;
        if (d.fee_percent) {
          var n = document.getElementById('fundNote');
          if (n) n.textContent = "A " + d.fee_percent + "% processing fee applies. Secured by KoraPay; your balance is only spendable on this store.";
        }
      }
      renderMethods();
    }).catch(function () { renderMethods(); });

  document.getElementById('fundBtn').addEventListener('click', async function () {
    var amt = Number(document.getElementById('custom').value || 0);
    if (amt < 100) { TENANT_AUTH.show(msg, 'Enter at least ₦100', 'err'); return; }
    var btn = this; btn.disabled = true;
    try {
      var res = await fetch("/api/payments/initialize", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount: amt, channel: method, tenant_token: SMSPIN.tenant.token(S) })
      });
      var d = await res.json();
      if (!res.ok || !d.checkout_url) throw new Error((d && d.error) || "Could not start payment");
      TENANT_AUTH.show(msg, 'Redirecting to secure checkout…', 'ok');
      location.href = d.checkout_url;
    } catch (e) { TENANT_AUTH.show(msg, e.message, 'err'); btn.disabled = false; }
  });

  var MAXC = 60;
  function renderCat() {
    var grid = document.getElementById('catGrid'), empty = document.getElementById('catEmpty');
    if (!grid) return;
    var q = (document.getElementById('buySearch').value || '').trim().toLowerCase();
    var rows = CAT.filter(function (c) {
      if (!q) return true;
      return ((c.service_name || '') + ' ' + (c.service || '') + ' ' +
              (c.country_name || '') + ' ' + (c.country || '')).toLowerCase().indexOf(q) !== -1;
    });
    var shown = rows.slice(0, MAXC);
    if (empty) empty.hidden = !!shown.length;
    grid.innerHTML = shown.map(function (c) {
      var stock = Number(c.stock || 0);
      return '<div class="ta-item">' +
        '<div class="ta-item-top">' + svcIcon(c) +
          '<div class="ta-item-tt"><b>' + esc(c.service_name || c.service) + '</b>' +
          '<span>' + esc((c.flag ? c.flag + ' ' : '') + (c.country_name || c.country)) + '</span></div></div>' +
        '<div class="ta-item-bot"><b class="ta-price">' + money(whole(c.price_ngn)) + '</b>' +
          '<span class="ta-stock">' + stock.toLocaleString() + ' in stock</span></div>' +
        '<button type="button" data-svc="' + esc(c.service) + '" data-ctry="' + esc(c.country) + '">Buy</button></div>';
    }).join('');
    Array.prototype.forEach.call(grid.querySelectorAll('button[data-svc]'), function (b) {
      b.addEventListener('click', function () { buy(b.getAttribute('data-svc'), b.getAttribute('data-ctry'), b); });
    });
  }

  function buy(svc, ctry, btn) {
    if (btn) btn.disabled = true;
    SMSPIN.buyOrder({ country: ctry, service: svc, tenantToken: SMSPIN.tenant.token(S) })
      .then(function (r) {
        TENANT_AUTH.show(msg, 'Number reserved: ' + r.phone_number + ' — waiting for SMS.', 'ok');
        refresh(); loadOrders();
      })
      .catch(function (e) { TENANT_AUTH.show(msg, e.message, 'err'); })
      .then(function () { if (btn) btn.disabled = false; });
  }

  document.getElementById('taLogout').addEventListener('click', async function () {
    await SMSPIN.tenant.logout(S); location.href = base + "/";
  });

  TENANT_AUTH.boot(function () {
    SMSPIN.rpc("business_public", { p_slug: S }).then(function (d) {
      if (d && d.catalog) { CAT = d.catalog; renderCat(); }
      // honour a preselected service/country from the storefront
      var q = new URLSearchParams(location.search);
      if (q.get("service")) {
        document.getElementById('buySearch').value = q.get("service");
        renderCat();
      }
    }).catch(function () {});
    var bs = document.getElementById('buySearch');
    if (bs) bs.addEventListener('input', renderCat);
    refresh();
    loadOrders();
  });
})();
</script>
</body>
</html>
