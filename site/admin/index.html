<header class="adm-top">

  <div id="admApp" hidden>
    <nav class="adm-tabs" id="admTabs">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="users">Users</button>
      <button data-tab="orders">Orders &amp; SMS</button>
      <button data-tab="tickets">Support</button>
      <button data-tab="payments">Payments</button>
      <button data-tab="catalog">Pricing</button>
      <button data-tab="margin">Margin</button>
      <button data-tab="tenants">Tenants</button>
      <button data-tab="fraud">Fraud</button>
      <button data-tab="flags">Settings</button>
      <button data-tab="runbooks">Runbooks</button>
      <button data-tab="growth">Growth</button>
      <button data-tab="status">Status</button>
    </nav>
    <section id="admBody"></section>
  </div>
</main>

<div class="adm-drawer" id="admDrawer"><div class="sheet" id="admSheet"></div></div>
<div class="adm-toast" id="admToast"></div>
