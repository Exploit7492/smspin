<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — SMSPin</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/_next/static/css/da1ef2f87b5d85aa.css">
<link rel="stylesheet" href="/_next/static/css/799dbddceaca5ff3.css">
<link rel="stylesheet" href="/_next/static/css/99187c56f9c480d0.css">
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:#111}
  .off{max-width:560px;margin:0 auto;padding:96px 24px;text-align:center}
  .off-ico{width:64px;height:64px;margin:0 auto 22px;border-radius:18px;background:#E11D2E;
    display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(225,29,46,.32)}
  .off h1{font-size:26px;margin:0 0 10px;letter-spacing:-.02em}
  .off p{color:#5b6472;line-height:1.6;margin:0 0 26px}
  .off a.btn{display:inline-block;background:#E11D2E;color:#fff;text-decoration:none;
    padding:12px 22px;border-radius:10px;font-weight:600}
</style>
</head>
<body>
  <main class="off">
    <div class="off-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#fff" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5C4 3.9 4.9 3 6 3H18C19.1 3 20 3.9 20 5V14C20 15.1 19.1 16 18 16H13L9.5 19.5C9 20 8 19.6 8 18.9V16H6C4.9 16 4 15.1 4 14V5Z"/>
      </svg>
    </div>
    <h1>You are offline</h1>
    <p>SMSPin needs a connection to reserve numbers and fetch SMS codes. Reconnect and we will pick up right where you left off.</p>
    <a class="btn" href="/">Try again</a>
  </main>
</body>
</html>
