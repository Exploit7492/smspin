<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video tutorials — SMSPin</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/theme.css?v=1794403291">
<script defer src="/theme.js"></script>
<style>
  .vwrap { max-width: 960px; margin: 0 auto; padding: 96px 20px 80px; }
  .vwrap h1 { font-size: clamp(28px, 4vw, 40px); margin: 0 0 8px; }
  .vwrap > p { color: var(--text-secondary); max-width: 640px; }
  .vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin-top: 34px; }
  .vcard { border: 1px solid var(--glass-border, rgba(0,0,0,.1)); border-radius: 16px; overflow: hidden;
    background: var(--glass-bg, #fff); display: flex; flex-direction: column; }
  .vthumb { aspect-ratio: 16/9; background: linear-gradient(135deg, #E11D2E, #7C3AED); position: relative;
    display: flex; align-items: center; justify-content: center; }
  .vthumb span { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.92);
    display: inline-flex; align-items: center; justify-content: center; font-size: 20px; color: #E11D2E; }
  .vmeta { padding: 14px 16px 18px; }
  .vmeta b { display: block; font-size: 15px; }
  .vmeta em { font-style: normal; font-size: 12px; color: var(--text-muted); }
  .vmeta p { font-size: 13px; color: var(--text-secondary); margin: 6px 0 0; }
  .vback { display: inline-block; margin-bottom: 20px; font-size: 13px; color: var(--brand, #E11D2E); text-decoration: none; }
</style>
</head>
<body>
<main class="vwrap">
  <a class="vback" href="/dashboard/">← Back to dashboard</a>
  <h1>Video tutorials</h1>
  <p>Short, no-nonsense walkthroughs. Prefer reading? The in-app Help button has a searchable knowledge base.</p>
  <div class="vgrid" id="videos"></div>
</main>
<script>
  const VIDEOS = [
    { slug: "fund-wallet", title: "Fund your wallet", mins: "0:45", desc: "Add money with a card, transfer or crypto." },
    { slug: "buy-number", title: "Buy your first number", mins: "1:10", desc: "Pick a service and country, then read the code." },
    { slug: "api-first-call", title: "Make your first API call", mins: "2:20", desc: "Create a key and place an order over HTTP." },
    { slug: "launch-store", title: "Launch a white-label store", mins: "3:05", desc: "Brand it, set markup and go live on your domain." },
    { slug: "become-operator", title: "Become an operator", mins: "1:50", desc: "Register SIMs and earn revenue share." },
    { slug: "webhooks", title: "Receive webhooks", mins: "1:35", desc: "Get a signed POST on every order event." },
  ];
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  document.getElementById("videos").innerHTML = VIDEOS.map(v =>
    '<article class="vcard" id="' + esc(v.slug) + '">' +
      '<div class="vthumb"><span aria-hidden="true">▶</span></div>' +
      '<div class="vmeta"><b>' + esc(v.title) + ' <em>' + esc(v.mins) + '</em></b><p>' + esc(v.desc) + '</p></div>' +
    "</article>").join("");
</script>
</body>
</html>
